# ============================================================
# PATHSHASHTRA BACKEND — PRODUCTION PROPERTIES
# All secrets loaded from environment variables.
#
# REQUIRED: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#           SPRING_DATASOURCE_PASSWORD, JWT_SECRET, GROQ_API_KEY,
#           REDIS_URL
# OPTIONAL: FRONTEND_URL, MAIL_USERNAME, MAIL_PASSWORD
# ============================================================

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA — validate only; Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# FLYWAY — database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# IMPORTANT: For first deployment on an existing DB, set FLYWAY_BASELINE_ON_MIGRATE=true
# to mark V1 as already applied. Remove after first successful deployment.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# REDIS — rate limiter, OTP, token blacklist, activity cache
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# AUTH COOKIE — HttpOnly, Secure, SameSite=None (cross-origin)
app.cookie.name=auth_token
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}
app.cookie.domain=${COOKIE_DOMAIN:}

# OAUTH2 GOOGLE
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# OAUTH2 GITHUB
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# APP
spring.application.name=pathshashtra-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain

# AI (Groq)
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# EMAIL (optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@pathshashtra.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000

# CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# LOGGING
logging.level.com.pathshashtra=INFO
logging.level.org.springframework.security=WARN

# REQUEST SIZE LIMITS
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.max-file-size=1MB
server.tomcat.max-http-form-post-size=1MB

# Actuator — disabled for public access
management.endpoints.web.exposure.include=none
management.endpoint.health.show-details=never

# Frontend URL for password reset links
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
