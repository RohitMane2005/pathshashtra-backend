# ============================================================
# PATHSHASHTRA BACKEND — PRODUCTION PROPERTIES
# All secrets loaded from environment variables.
#
# REQUIRED: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#           SPRING_DATASOURCE_PASSWORD, JWT_SECRET, GROQ_API_KEY
# OPTIONAL: FRONTEND_URL, MAIL_USERNAME, MAIL_PASSWORD
# First deploy: JPA_DDL_AUTO=update → then switch to validate
# ============================================================

# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# APP
spring.application.name=pathshashtra-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain

# AI (Groq)
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# EMAIL (optional — OTP removed, kept for future notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@pathshashtra.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000

# CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# LOGGING
logging.level.com.pathshashtra=INFO
logging.level.org.springframework.security=WARN

# REQUEST SIZE LIMIT — prevents request body bombs (large JSON payloads)
# Without this, an attacker can send a 100MB JSON body that blocks a thread
# until it's fully read, potentially exhausting the thread pool.
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.max-file-size=1MB
server.tomcat.max-http-form-post-size=1MB

# Actuator — expose only health, hide all other endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Frontend URL for password reset links
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
