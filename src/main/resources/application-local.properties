# ============================================================
# PATHSHASHTRA BACKEND — LOCAL DEVELOPMENT PROFILE
# Activate with: --spring.profiles.active=local
#
# Uses H2 in-memory DB (no PostgreSQL needed), disables Flyway,
# and sets safe defaults for all required env vars.
# ============================================================

# DATABASE — H2 in-memory (no external DB needed)
spring.datasource.url=jdbc:h2:mem:pathshashtra;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA — auto-create schema from entities (no Flyway needed locally)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# FLYWAY — disabled for local dev (H2 doesn't need migrations)
spring.flyway.enabled=false

# COOKIE — insecure for localhost
app.cookie.secure=false
app.cookie.same-site=Lax

# H2 Console — enable for local DB inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# REDIS — reduce connection timeout for faster failure detection
spring.data.redis.timeout=500ms
spring.data.redis.lettuce.pool.max-active=2
spring.data.redis.lettuce.pool.max-idle=1
spring.data.redis.lettuce.pool.min-idle=0

# LOGGING — cleaner output for local dev
logging.level.com.pathshashtra=DEBUG
logging.level.org.springframework.security=WARN
logging.level.io.lettuce.core=WARN
logging.level.org.springframework.data.redis=WARN

# Disable structured JSON logging for local readability
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Session cookie — insecure for localhost
server.servlet.session.cookie.secure=false
